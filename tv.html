<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitBus — Live Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC8X-ZCxl_6kurEMlZOWB_uz78KX4jm8YU&callback=initMap" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b24;
      --border:  #2a3244;
      --accent:  #f77f2a;
      --green:   #4caf8a;
      --text:    #e8ddd0;
      --muted:   #6b7a94;
      --label:   #8899b8;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
    }

    /* ── STANDBY ── */
    #standby {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      gap: 1.5rem;
      z-index: 10;
    }

    #standby .bus-icon {
      font-size: 5rem;
      animation: drift 3s ease-in-out infinite;
    }

    #standby .standby-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #standby .standby-dots span {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 5px;
      animation: blink 1.4s ease-in-out infinite;
    }

    #standby .standby-dots span:nth-child(2) { animation-delay: 0.2s; }
    #standby .standby-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── MAIN LAYOUT ── */
    #display {
      display: none;
      width: 100vw;
      height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr auto;
      height: 100vh;
    }

    /* ── LEFT PANEL ── */
    .info-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4vh 5vw 4vh 6vw;
      gap: 4vh;
      border-right: 2px solid var(--border);
      background: var(--surface);
    }

    .trip-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1.8rem, 4vh, 3rem);
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── INFO BLOCKS ── */
    .info-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .info-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1.4rem, 3vh, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--label);
    }

    .info-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 11vh, 8.5rem);
      line-height: 1;
      color: var(--text);
    }

    .info-value.accent { color: var(--accent); }
    .info-value.green  { color: var(--green);  }

    .info-sub {
      font-family: 'Barlow', sans-serif;
      font-size: clamp(1.2rem, 2.6vh, 2rem);
      font-weight: 600;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .info-sub2 {
      font-family: 'Barlow', sans-serif;
      font-size: clamp(1rem, 2.2vh, 1.7rem);
      font-weight: 400;
      color: var(--muted);
      opacity: 0.7;
    }

    .divider {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── DISTANCE ── */
    .distance-row {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .distance-unit {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.5rem, 6vh, 5rem);
      font-weight: 700;
      color: var(--green);
      opacity: 0.7;
      line-height: 1;
    }

    /* ── LAST UPDATE ── */
    .update-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: auto;
    }

    .update-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .update-text {
      font-size: clamp(1rem, 2vh, 1.5rem);
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ── MAP PANEL ── */
    .map-panel {
      position: relative;
      background: #0a0f18;
      flex-shrink: 0;
    }

    #busMap {
      width: 100%;
      height: 100%;
    }

    /* ── ANIMATIONS ── */
    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>

<!-- STANDBY -->
<div id="standby">
  <div class="bus-icon">🚌</div>
  <div class="standby-label">Receiving Trip Data</div>
  <div class="standby-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- LIVE DISPLAY -->
<div id="display">
  <div class="layout">

    <!-- LEFT: Info -->
    <div class="info-panel">

      <div class="trip-name" id="tripName">—</div>

      <div class="info-block">
        <div class="info-label">Destination ETA</div>
        <div class="info-value accent" id="etaDestination">—</div>
        <div class="info-sub" id="destName">—</div>
      </div>

      <div class="divider"></div>

      <div class="info-block">
        <div class="info-label">Next Stop</div>
        <div class="info-value" id="etaNextStop">—</div>
        <div class="info-sub" id="nextStopName">—</div>
        <div class="info-sub2" id="nextStopAddress">—</div>
      </div>

      <div class="divider"></div>

      <div class="info-block">
        <div class="info-label">Distance Remaining</div>
        <div class="distance-row">
          <div class="info-value green" id="distNum">—</div>
          <div class="distance-unit" id="distUnit"></div>
        </div>
      </div>

      <div class="update-row">
        <div class="update-dot"></div>
        <div class="update-text" id="lastUpdate">Waiting for update...</div>
      </div>

    </div>

    <!-- RIGHT: Map -->
    <div class="map-panel" id="mapPanel">
      <div id="busMap"></div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL      = 'https://xumvkilemhtglrvueqtu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WNs4wTiZ8tPGSKySXO2M8Q_HT8dkArv';
  const REFRESH_MS        = 30000;

  let pendingPos = null;

  // Size map panel as square based on viewport height
  function sizeMapPanel() {
    const panel = document.getElementById('mapPanel');
    const h = window.innerHeight;
    panel.style.width  = h + 'px';
    panel.style.height = h + 'px';
  }

  sizeMapPanel();
  window.addEventListener('resize', () => {
    sizeMapPanel();
    if (window.busMap) {
      google.maps.event.trigger(window.busMap, 'resize');
    }
  });

  function getZoom(distanceStr) {
    if (!distanceStr || distanceStr === '—') return 10;
    const miles = parseFloat(distanceStr);
    if (isNaN(miles)) return 10;
    if (miles < 5)  return 12;
    if (miles < 20) return 11;
    return 10;
  }

  function timeSince(isoString) {
    if (!isoString) return '';
    const mins = Math.floor((Date.now() - new Date(isoString)) / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    return `${mins} mins ago`;
  }

  function parseDistance(distStr) {
    if (!distStr || distStr === '—') return { num: '—', unit: '' };
    const parts = distStr.trim().split(' ');
    return { num: parts[0], unit: parts[1] || '' };
  }

  function renderTrip(state) {
    const standby = document.getElementById('standby');
    const display = document.getElementById('display');

    if (!state || state.status === 'inactive') {
      standby.style.display = 'flex';
      display.style.display = 'none';
      return;
    }

    standby.style.display = 'none';
    display.style.display = 'block';

    // Trip name
    document.getElementById('tripName').textContent = state.trip_name || '';

    // Destination ETA
    document.getElementById('etaDestination').textContent = state.eta_destination || '—';
    document.getElementById('destName').textContent = state.destination || '';

    // Next stop
    document.getElementById('etaNextStop').textContent = state.eta_next_stop || '—';

    let nextStopName = '—';
    let nextStopAddr = '';
    if (state.stops && Array.isArray(state.stops)) {
      const next = state.stops.find(s => s.status === 'upcoming' || s.status === 'active');
      if (next) {
        nextStopName = next.name || '';
        nextStopAddr = next.address || '';
      }
    }
    document.getElementById('nextStopName').textContent    = nextStopName;
    document.getElementById('nextStopAddress').textContent = nextStopAddr;

    // Distance
    const { num, unit } = parseDistance(state.distance_remaining);
    document.getElementById('distNum').textContent  = num;
    document.getElementById('distUnit').textContent = unit;

    // Last update
    document.getElementById('lastUpdate').textContent =
      state.updated_at ? `Last update: ${timeSince(state.updated_at)}` : '';

    // Map
    if (state.lat && state.lng) {
      const pos  = { lat: parseFloat(state.lat), lng: parseFloat(state.lng) };
      const zoom = getZoom(state.distance_remaining);
      if (!window.busMap) {
        pendingPos  = { pos, zoom };
      } else {
        window.busMap.setZoom(zoom);
        window.busMarker.setPosition(pos);
        window.busMap.panTo(pos);
      }
    }
  }

  async function fetchTripState() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/trip_state?select=*&order=updated_at.desc&limit=1`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      const data = await res.json();
      return data && data.length > 0 ? data[0] : null;
    } catch(e) {
      console.warn('Supabase fetch failed', e);
      return null;
    }
  }

  async function refresh() {
    const state = await fetchTripState();
    renderTrip(state);
  }

  // Google Maps JS API
  window.initMap = function() {
    window.busMap = new google.maps.Map(document.getElementById('busMap'), {
      zoom: 10,
      center: { lat: 38.5, lng: -98.0 },
      mapTypeId: 'roadmap',
      zoomControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      mapTypeControl: false,
      gestureHandling: 'none',
    });

    window.busMarker = new google.maps.Marker({
      map: window.busMap,
      title: 'Bus Location',
      icon: {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18" fill="#f77f2a" stroke="white" stroke-width="3"/>
            <text x="20" y="26" text-anchor="middle" font-size="18">🚌</text>
          </svg>`),
        scaledSize: new google.maps.Size(40, 40),
        anchor: new google.maps.Point(20, 20),
      }
    });

    if (pendingPos) {
      window.busMap.setZoom(pendingPos.zoom);
      window.busMarker.setPosition(pendingPos.pos);
      window.busMap.panTo(pendingPos.pos);
      pendingPos = null;
    }
  };

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
