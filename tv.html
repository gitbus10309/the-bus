<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitBus — Live Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC8X-ZCxl_6kurEMlZOWB_uz78KX4jm8YU&callback=initMap" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b24;
      --border:  #2a3244;
      --accent:  #f77f2a;
      --green:   #4caf8a;
      --text:    #e8ddd0;
      --muted:   #6b7a94;
      --label:   #8899b8;
      --cream:   #e8ddd0;
    }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
    }

    /* ── STANDBY ── */
    #standby {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg); gap: 1.5rem; z-index: 10;
    }
    #standby .bus-icon { font-size: 5rem; animation: drift 3s ease-in-out infinite; }
    #standby .standby-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.8rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    #standby .standby-dots span {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; background: var(--accent); margin: 0 5px;
      animation: blink 1.4s ease-in-out infinite;
    }
    #standby .standby-dots span:nth-child(2) { animation-delay: 0.2s; }
    #standby .standby-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── MAIN LAYOUT ── */
    #display { display: none; width: 100vw; height: 100vh; }
    .layout { display: grid; grid-template-columns: 1fr 72vh; height: 100vh; }

    /* ── LEFT PANEL ── */
    .info-panel {
      display: flex; flex-direction: column; justify-content: center;
      padding: 3vh 5vw 3vh 6vw; gap: 2.5vh;
      border-right: 2px solid var(--border); background: var(--surface);
      min-width: 0; overflow: hidden;
    }
    .trip-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3.3rem, 6.6vh, 5.5rem); font-weight: 700;
      color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .info-block { display: flex; flex-direction: column; gap: 0.3rem; }

    /* Label row: ETA left-aligned, DISTANCE right-aligned */
    .label-row {
      display: flex; justify-content: space-between;
      padding: 0 0;
    }
    .info-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.4rem, 5vh, 4rem); font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--label);
    }
    .info-label.eta-label  { text-align: left; }
    .info-label.dist-label { text-align: right; }
    .info-label.hidden { color: transparent; }

    /* Value row: time left, miles right-justified */
    .value-row {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .info-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900; font-size: clamp(4rem, 11vh, 8.5rem);
      line-height: 1; color: var(--text);
    }
    .info-value.time  {
      font-size: clamp(5rem, 13vh, 10rem);
      font-family: 'Oswald', sans-serif;
      letter-spacing: -0.01em;
    }
    .info-value.accent { color: var(--accent); }
    .info-value.green  { color: var(--green); font-family: 'Oswald', sans-serif; letter-spacing: -0.01em; }
    .info-value.cream  { color: var(--cream); font-family: 'Oswald', sans-serif; letter-spacing: -0.01em; }
    .info-value.right  { text-align: right; }
    .info-sub {
      font-family: 'Barlow', sans-serif;
      font-size: clamp(2rem, 4vh, 3.2rem); font-weight: 600;
      color: var(--muted); margin-top: 0.15rem;
    }
    .divider { height: 2px; background: var(--border); border-radius: 2px; flex-shrink: 0; }

    /* Upcoming stops table */
    .upcoming-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.4rem, 5vh, 4rem); font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--label);
      margin-bottom: 0.4rem;
    }
    .upcoming-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.4rem, 5vh, 4rem); font-weight: 600;
      color: var(--muted); padding: 0.15rem 0;
    }
    .upcoming-name     { flex: 1; }
    .upcoming-duration { text-align: right; flex-shrink: 0; }

    /* Last update overlay */
    .update-overlay {
      position: absolute; bottom: 1.5vh; right: 1.5vw;
      background: rgba(13,17,23,0.82); border-radius: 8px;
      padding: 0.4rem 0.9rem;
      font-size: clamp(1.2rem, 2.2vh, 1.8rem); font-weight: 600;
      color: var(--muted); letter-spacing: 0.04em;
      pointer-events: none;
    }

    /* ── MAP PANEL ── */
    .map-panel { position: relative; background: #0a0f18; width: 72vh; height: 100vh; overflow: hidden; }
    #busMap { width: 72vh; height: 72vh; position: absolute; top: 50%; left: 0; transform: translateY(-50%); }

    /* ── ANIMATIONS ── */
    @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes blink { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1.1)} }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.85)} }
  </style>
</head>
<body>

<!-- STANDBY -->
<div id="standby">
  <div class="bus-icon">🚌</div>
  <div class="standby-label">Receiving Trip Data</div>
  <div class="standby-dots"><span></span><span></span><span></span></div>
</div>

<!-- LIVE DISPLAY -->
<div id="display">
  <div class="layout">
    <div class="info-panel">

      <!-- Trip name -->
      <div class="trip-name" id="tripName">—</div>

      <div class="divider"></div>

      <!-- TOP: Destination ETA + Distance -->
      <div class="info-block">
        <div class="label-row">
          <div class="info-label eta-label">ETA</div>
          <div class="info-label dist-label">DISTANCE</div>
        </div>
        <div class="value-row">
          <div class="info-value time accent" id="etaDestination">—</div>
          <div class="info-value green right" id="distanceRemaining">—</div>
        </div>
        <div class="info-sub" id="destName">—</div>
      </div>

      <div class="divider"></div>

      <!-- MIDDLE: Next Stop -->
      <div class="info-block">
        <div class="info-label eta-label" id="nextStopHeader">NEXT STOP</div>
        <div class="label-row" style="margin-top:0.4rem">
          <div class="info-label eta-label" id="nextLabelEta">ETA</div>
          <div class="info-label dist-label" id="nextLabelDist">DISTANCE</div>
        </div>
        <div class="value-row">
          <div class="info-value time cream" id="etaNextStop">—</div>
          <div class="info-value cream right" id="distNextStop">—</div>
        </div>
        <div class="info-sub" id="nextStopAddress"></div>
      </div>

      <div class="divider"></div>

      <!-- BOTTOM: Upcoming Stops -->
      <div class="info-block" style="flex:1;overflow:hidden">
        <div class="upcoming-header">Upcoming Stops</div>
        <div id="upcomingList"></div>
      </div>

    </div>

    <div class="map-panel" id="mapPanel" style="position:relative">
      <div id="busMap"></div>
      <div class="update-overlay" id="lastUpdate">Waiting for update...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL      = 'https://xumvkilemhtglrvueqtu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WNs4wTiZ8tPGSKySXO2M8Q_HT8dkArv';
  const REFRESH_MS        = 30000;

  let pendingPos   = null;
  let stopMarkers  = []; // {marker, stopIndex} — active pins on map
  let destMarker   = null;

  function sizeMapPanel() {
    const panel = document.getElementById('mapPanel');
    const h = window.innerHeight;
    panel.style.width  = h + 'px';
    panel.style.height = h + 'px';
  }
  sizeMapPanel();
  window.addEventListener('resize', () => {
    sizeMapPanel();
    if (window.busMap) google.maps.event.trigger(window.busMap, 'resize');
  });

  function getZoom(distanceStr) {
    if (!distanceStr || distanceStr === '—') return 11;
    const miles = parseFloat(distanceStr);
    if (isNaN(miles)) return 11;
    if (miles < 5)  return 13;
    if (miles < 20) return 12;
    return 11;
  }

  function timeSince(isoString) {
    if (!isoString) return '';
    const mins = Math.floor((Date.now() - new Date(isoString)) / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    return `${mins} mins ago`;
  }

  function parseDistance(distStr) {
    if (!distStr || distStr === '—') return { num: '—', unit: '' };
    const parts = distStr.trim().split(' ');
    return { num: parts[0], unit: parts[1] || '' };
  }

  // ── STOP NUMBER SVG (cream, numbered) ──
  function stopPinSvg(num) {
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
        <path d="M18 0 C8 0 0 8 0 18 C0 30 18 44 18 44 C18 44 36 30 36 18 C36 8 28 0 18 0 Z"
              fill="#e8ddd0" stroke="#2a3244" stroke-width="2"/>
        <text x="18" y="23" text-anchor="middle" font-size="15"
              font-family="Barlow Condensed, sans-serif" font-weight="900"
              fill="#0d1117">${num}</text>
      </svg>`);
  }

  // ── DESTINATION PIN SVG (orange) ──
  function destPinSvg() {
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
        <path d="M18 0 C8 0 0 8 0 18 C0 30 18 44 18 44 C18 44 36 30 36 18 C36 8 28 0 18 0 Z"
              fill="#f77f2a" stroke="white" stroke-width="2"/>
        <circle cx="18" cy="18" r="6" fill="white"/>
      </svg>`);
  }

  // ── GEOCODE an address and return {lat,lng} or null ──
  function geocodeAddress(address) {
    return new Promise((resolve) => {
      if (!window.geocoder) window.geocoder = new google.maps.Geocoder();
      window.geocoder.geocode({ address }, (results, status) => {
        if (status === 'OK' && results[0]) {
          const loc = results[0].geometry.location;
          resolve({ lat: loc.lat(), lng: loc.lng() });
        } else {
          resolve(null);
        }
      });
    });
  }

  // ── CLEAR all stop/dest markers ──
  function clearStopMarkers() {
    stopMarkers.forEach(m => m.setMap(null));
    stopMarkers = [];
    if (destMarker) { destMarker.setMap(null); destMarker = null; }
  }

  // ── RENDER stop + destination pins ──
  async function renderPins(state) {
    if (!window.busMap) return;
    clearStopMarkers();

    // Destination pin
    if (state.destination) {
      const pos = await geocodeAddress(state.destination);
      if (pos) {
        destMarker = new google.maps.Marker({
          map: window.busMap,
          position: pos,
          title: 'Destination',
          icon: {
            url: destPinSvg(),
            scaledSize: new google.maps.Size(50, 62),
            anchor: new google.maps.Point(25, 62),
          }
        });
      }
    }

    // Stop pins — upcoming only, numbered by original trip order
    if (state.stops && Array.isArray(state.stops)) {
      // stops[0] is origin — skip it; stops[last] is destination — skip it
      const midStops = state.stops.slice(1, state.stops.length - 1);
      for (let i = 0; i < midStops.length; i++) {
        const stop = midStops[i];
        if (stop.status === 'done') continue;
        if (!stop.address) continue;
        const pos = await geocodeAddress(stop.address);
        if (pos) {
          const marker = new google.maps.Marker({
            map: window.busMap,
            position: pos,
            title: stop.name || `Stop ${i + 1}`,
            icon: {
              url: stopPinSvg(i + 1),
              scaledSize: new google.maps.Size(50, 62),
              anchor: new google.maps.Point(25, 62),
            }
          });
          stopMarkers.push(marker);
        }
      }
    }
  }

  let lastStopsJson = '';

  function renderTrip(state) {
    const standby = document.getElementById('standby');
    const display = document.getElementById('display');

    if (!state || state.status === 'inactive') {
      standby.style.display = 'flex';
      display.style.display = 'none';
      clearStopMarkers();
      lastStopsJson = '';
      return;
    }

    standby.style.display = 'none';
    display.style.display = 'block';

    // Trip name
    document.getElementById('tripName').textContent = state.trip_name || '';

    // Destination ETA + distance (top section)
    document.getElementById('etaDestination').textContent = state.eta_destination || '—';
    document.getElementById('distanceRemaining').textContent = state.distance_remaining || '—';
    document.getElementById('destName').textContent = state.destination || '';

    // Next stop — find first upcoming/active in midStops
    let nextStopLabel = '';
    let nextStopAddr  = '';
    let hasNextStop   = false;

    if (state.stops && Array.isArray(state.stops)) {
      const midStops = state.stops.slice(1, state.stops.length - 1);
      const nextIdx  = midStops.findIndex(s => s.status === 'upcoming' || s.status === 'active' || s.status === 'at_stop');
      if (nextIdx !== -1) {
        hasNextStop = true;
        const next    = midStops[nextIdx];
        const stopNum = nextIdx + 1;
        const label   = next.name || '';
        nextStopLabel = label ? `Stop ${stopNum}: ${label}` : `Stop ${stopNum}`;
        nextStopAddr  = next.address || '';
      }
    }

    if (hasNextStop) {
      // Waypoint in queue — use stop name directly from already-captured label
      const stopName = nextStopLabel.includes(': ') ? nextStopLabel.split(': ').slice(1).join(': ') : nextStopLabel;
      document.getElementById('nextStopHeader').textContent  = `NEXT STOP: ${stopName}`;
      document.getElementById('nextStopAddress').textContent = nextStopAddr;
      document.getElementById('etaNextStop').textContent     = state.eta_next_stop || '—';
      document.getElementById('distNextStop').textContent    = state.distance_next_stop || '—';
      document.getElementById('nextLabelEta').classList.remove('hidden');
      document.getElementById('nextLabelDist').classList.remove('hidden');
      document.getElementById('etaNextStop').classList.add('cream');
      document.getElementById('distNextStop').classList.add('cream');
    } else {
      // No waypoint — destination only
      const destTitle   = state.destination_title || state.destination || '';
      const destAddress = state.destination || '';
      document.getElementById('nextStopHeader').textContent  = 'NEXT STOP: DESTINATION';
      document.getElementById('nextStopAddress').textContent = destAddress;
      document.getElementById('etaNextStop').textContent     = destTitle || '—';
      document.getElementById('distNextStop').textContent    = '';
      document.getElementById('nextLabelEta').classList.add('hidden');
      document.getElementById('nextLabelDist').classList.add('hidden');
      document.getElementById('etaNextStop').classList.add('cream');
      document.getElementById('distNextStop').classList.add('cream');
    }

    // Upcoming stops list (all stops after next, not yet done)
    const upcomingList = document.getElementById('upcomingList');
    upcomingList.innerHTML = '';
    if (state.stops && Array.isArray(state.stops)) {
      const midStops = state.stops.slice(1, state.stops.length - 1);
      const nextIdx = midStops.findIndex(s => s.status === 'upcoming' || s.status === 'active' || s.status === 'at_stop');
      const afterNext = nextIdx !== -1 ? midStops.slice(nextIdx + 1) : [];
      afterNext.forEach((stop) => {
        if (stop.status === 'done') return;
        const row = document.createElement('div');
        row.className = 'upcoming-row';
        const title = stop.name || '';

        // Format duration from HH:MM
        let durationStr = '';
        if (stop.duration) {
          const parts = String(stop.duration).trim().split(':');
          if (parts.length === 2) {
            const hrs  = parseInt(parts[0]) || 0;
            const mins = parseInt(parts[1]) || 0;
            if (hrs > 0 && mins > 0)       durationStr = `Duration: ${hrs} hr ${mins} min`;
            else if (hrs > 0)              durationStr = `Duration: ${hrs} hr`;
            else if (mins > 0)             durationStr = `Duration: ${mins} min`;
          }
        }

        row.innerHTML = `
          <span class="upcoming-name">${title}</span>
          <span class="upcoming-duration">${durationStr}</span>
        `;
        upcomingList.appendChild(row);
      });
    }

    // Last update overlay
    document.getElementById('lastUpdate').textContent =
      state.updated_at ? `Last update: ${timeSince(state.updated_at)}` : '';

    // Map position + zoom
    if (state.lat && state.lng) {
      const pos  = { lat: parseFloat(state.lat), lng: parseFloat(state.lng) };
      const zoom = getZoom(state.distance_remaining);
      if (!window.busMap) {
        pendingPos = { pos, zoom };
      } else {
        window.busMarker.setPosition(pos);
        window.busMap.panTo(pos);
        google.maps.event.addListenerOnce(window.busMap, 'idle', function() {
          window.busMap.setZoom(zoom);
        });
      }
    }

    // Re-render pins only when stop statuses change
    const stopsJson = JSON.stringify((state.stops || []).map(s => ({ status: s.status, address: s.address })));
    if (stopsJson !== lastStopsJson) {
      lastStopsJson = stopsJson;
      renderPins(state);
    }
  }

  async function fetchTripState() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/trip_state?select=*&order=updated_at.desc&limit=1`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      const data = await res.json();
      return data && data.length > 0 ? data[0] : null;
    } catch(e) {
      console.warn('Supabase fetch failed', e);
      return null;
    }
  }

  async function refresh() {
    const state = await fetchTripState();
    renderTrip(state);
  }

  window.initMap = function() {
    window.busMap = new google.maps.Map(document.getElementById('busMap'), {
      zoom: 11,
      center: { lat: 38.5, lng: -98.0 },
      mapTypeId: 'roadmap',
      zoomControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      mapTypeControl: false,
      gestureHandling: 'none',
      styles: [
        { elementType: 'geometry',        stylers: [{ color: '#1a1f2e' }] },
        { elementType: 'labels.text.fill',stylers: [{ color: '#c8d0e0' }] },
        { elementType: 'labels.text.stroke',stylers:[{ color: '#1a1f2e' }] },
        { featureType: 'road',            elementType: 'geometry',       stylers: [{ color: '#2e3a50' }] },
        { featureType: 'road.highway',    elementType: 'geometry',       stylers: [{ color: '#3d5070' }] },
        { featureType: 'road.highway',    elementType: 'geometry.stroke',stylers: [{ color: '#1a1f2e' }] },
        { featureType: 'road',            elementType: 'labels.text.fill',stylers:[{ color: '#9ab0cc' }] },
        { featureType: 'water',           elementType: 'geometry',       stylers: [{ color: '#0d1a30' }] },
        { featureType: 'water',           elementType: 'labels.text.fill',stylers:[{ color: '#4a7fa5' }] },
        { featureType: 'poi',             stylers: [{ visibility: 'off' }] },
        { featureType: 'transit',         stylers: [{ visibility: 'off' }] },
        { featureType: 'administrative',  elementType: 'labels.text.fill',stylers:[{ color: '#a0b4cc' }] },
        { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers:[{ color: '#d0dcea' }] },
      ]
    });

    window.busMarker = new google.maps.Marker({
      map: window.busMap,
      title: 'Bus Location',
      icon: {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="73" height="73" viewBox="0 0 73 73">
            <text x="36" y="56" text-anchor="middle" font-size="56">🚌</text>
          </svg>`),
        scaledSize: new google.maps.Size(73, 73),
        anchor: new google.maps.Point(36, 56),
      }
    });

    if (pendingPos) {
      window.busMarker.setPosition(pendingPos.pos);
      window.busMap.panTo(pendingPos.pos);
      google.maps.event.addListenerOnce(window.busMap, 'idle', function() {
        window.busMap.setZoom(pendingPos.zoom);
      });
      pendingPos = null;
    }
  };

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
